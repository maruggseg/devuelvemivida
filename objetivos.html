<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="style.css" />
  <title>Objetivos Diarios</title>
</head>
<body>
  <main class="sheet">
    <h1>Objetivos diarios</h1>
    <p class="subtitle">Constancia, no perfección. Márcalos cada día para mantener la racha.</p>

    <div class="field">
      <label for="nuevoObjetivo">Nuevo objetivo</label>
      <input type="text" id="nuevoObjetivo" placeholder="Ej: Ir al gym" />
    </div>
    <div class="actions" style="margin-bottom: 2rem;">
      <button onclick="agregarObjetivo()">Agregar objetivo</button>
      <button id="btnNotificar" class="secondary" onclick="activarRecordatorio()">Activar recordatorio 22:55</button>
    </div>

    <ul id="listaObjetivos" class="goals"></ul>

    <hr class="rule" />

    <div class="actions">
      <button class="secondary" onclick="window.location.href='index.html'">Volver a inicio</button>
    </div>
  </main>

  <script>
    const lista = document.getElementById('listaObjetivos');
    const btnNotificar = document.getElementById('btnNotificar');

    function obtenerHoy() {
      return new Date().toISOString().split('T')[0];
    }

    function obtenerAyer() {
      const ayer = new Date();
      ayer.setDate(ayer.getDate() - 1);
      return ayer.toISOString().split('T')[0];
    }

    function cargarObjetivosGuardados() {
      return JSON.parse(localStorage.getItem('objetivosDiarios')) || [];
    }

    function guardarObjetivos(objetivos) {
      localStorage.setItem('objetivosDiarios', JSON.stringify(objetivos));
    }

    function cargarObjetivos() {
      lista.innerHTML = '';
      const objetivos = cargarObjetivosGuardados();
      const hoy = obtenerHoy();

      if (objetivos.length === 0) {
        lista.innerHTML = '<p class="empty">No tienes objetivos aún. Añade el primero arriba.</p>';
        return;
      }

      objetivos.forEach((obj, i) => {
        const li = document.createElement('li');

        const info = document.createElement('span');
        info.className = 'goal-text';
        info.textContent = obj.texto;

        const streak = document.createElement('span');
        streak.className = 'streak';
        streak.textContent = `Racha: ${obj.racha || 0} día${obj.racha !== 1 ? 's' : ''}`;

        const btn = document.createElement('button');
        btn.textContent = obj.ultimaFechaHecho === hoy ? 'Hecho ✅' : 'Marcar hecho';
        btn.disabled = obj.ultimaFechaHecho === hoy;
        btn.onclick = () => {
          if (obj.ultimaFechaHecho === hoy) return;
          obj.racha = (obj.ultimaFechaHecho === obtenerAyer()) ? (obj.racha || 0) + 1 : 1;
          obj.ultimaFechaHecho = hoy;
          guardarObjetivos(objetivos);
          cargarObjetivos();
        };

        const eliminarBtn = document.createElement('button');
        eliminarBtn.className = 'secondary';
        eliminarBtn.textContent = 'Eliminar';
        eliminarBtn.onclick = () => {
          objetivos.splice(i, 1);
          guardarObjetivos(objetivos);
          cargarObjetivos();
        };

        li.appendChild(info);
        li.appendChild(streak);
        li.appendChild(btn);
        li.appendChild(eliminarBtn);
        lista.appendChild(li);
      });
    }

    function agregarObjetivo() {
      const input = document.getElementById('nuevoObjetivo');
      const texto = input.value.trim();
      if (!texto) return;
      const objetivos = cargarObjetivosGuardados();
      objetivos.push({ texto, racha: 0, ultimaFechaHecho: '' });
      guardarObjetivos(objetivos);
      input.value = '';
      cargarObjetivos();
    }

    document.getElementById('nuevoObjetivo').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') agregarObjetivo();
    });

    function revisarObjetivosNoCompletados() {
      const hoy = obtenerHoy();
      const objetivos = cargarObjetivosGuardados();
      const algunoNoHecho = objetivos.some(obj => obj.ultimaFechaHecho !== hoy);

      if (algunoNoHecho && Notification.permission === 'granted') {
        new Notification('⚠️ ¡Oye!', {
          body: 'Aún no has marcado todos tus objetivos de hoy.'
        });
      }
    }

    function programarNotificacionDiaria() {
      const ahora = new Date();
      const proxima = new Date();
      proxima.setHours(22, 55, 0, 0);
      if (proxima < ahora) proxima.setDate(proxima.getDate() + 1);

      setTimeout(() => {
        revisarObjetivosNoCompletados();
        programarNotificacionDiaria();
      }, proxima - ahora);
    }

    function actualizarBotonNotificacion() {
      if (!('Notification' in window)) {
        btnNotificar.hidden = true;
        return;
      }
      if (Notification.permission === 'granted') {
        btnNotificar.textContent = 'Recordatorio activado ✅';
        btnNotificar.disabled = true;
      }
    }

    function activarRecordatorio() {
      if (!('Notification' in window)) return;
      Notification.requestPermission().then(() => {
        actualizarBotonNotificacion();
        programarNotificacionDiaria();
      });
    }

    window.addEventListener('load', () => {
      cargarObjetivos();
      actualizarBotonNotificacion();
      if ('Notification' in window && Notification.permission === 'granted') {
        programarNotificacionDiaria();
      }
    });
  </script>
</body>
</html>
