<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="style.css" />
  <meta name="description" content="Marca tus objetivos diarios y mantén la racha con DevuélvemeMiVida." />
  <title>Objetivos Diarios</title>
</head>
<body>
  <main class="sheet">
    <h1>Objetivos diarios</h1>
    <p class="subtitle">Constancia, no perfección. Márcalos cada día para mantener la racha.</p>

    <div id="bannerRacha" class="alert-box" aria-live="polite" hidden></div>

    <div class="field">
      <label for="nuevoObjetivo">Nuevo objetivo</label>
      <input type="text" id="nuevoObjetivo" placeholder="Ej: Ir al gym" />
    </div>
    <div class="actions" style="margin-bottom: 2rem;">
      <button onclick="alAgregarObjetivo()">Agregar objetivo</button>
      <button id="btnNotificar" class="secondary" onclick="activarRecordatorio()">Activar recordatorio 22:55</button>
    </div>

    <ul id="listaObjetivos" class="goals"></ul>

    <hr class="rule" />

    <div class="actions">
      <button class="secondary" onclick="window.location.href='estadisticas.html'">Ver mis estadísticas</button>
      <button class="secondary" onclick="window.location.href='index.html'">Volver a inicio</button>
    </div>
  </main>

  <script src="objetivos.js"></script>
  <script>
    const lista = document.getElementById('listaObjetivos');
    const btnNotificar = document.getElementById('btnNotificar');
    const bannerRacha = document.getElementById('bannerRacha');

    function pintarObjetivos() {
      lista.innerHTML = '';
      const objetivos = cargarObjetivos();
      const hoy = obtenerHoy();

      mostrarBannerRachaSiAplica(bannerRacha);

      if (objetivos.length === 0) {
        lista.innerHTML = '<p class="empty">No tienes objetivos aún. Añade el primero arriba.</p>';
        return;
      }

      objetivos.forEach((obj, i) => {
        const li = document.createElement('li');

        const fila = document.createElement('div');
        fila.className = 'goal-row';

        const info = document.createElement('span');
        info.className = 'goal-text';
        info.textContent = obj.texto;

        const streak = document.createElement('button');
        streak.type = 'button';
        streak.className = 'streak streak-toggle';
        const insignia = insigniaPara(obj.racha || 0);
        streak.textContent = `${insignia ? insignia + ' ' : ''}Racha: ${obj.racha || 0} día${obj.racha !== 1 ? 's' : ''} (mejor: ${obj.mejorRacha || 0}) 📅`;
        streak.title = 'Ver calendario';

        const btn = document.createElement('button');
        btn.textContent = obj.ultimaFechaHecho === hoy ? 'Hecho ✅' : 'Marcar hecho';
        btn.disabled = obj.ultimaFechaHecho === hoy;
        btn.onclick = () => {
          const hito = marcarHecho(objetivos, i);
          lanzarConfeti();
          if (hito) {
            setTimeout(() => alert(`🎉 ¡Racha de ${hito} días en "${obj.texto}"! Sigue así.`), 150);
          }
          pintarObjetivos();
        };

        const eliminarBtn = document.createElement('button');
        eliminarBtn.className = 'secondary';
        eliminarBtn.textContent = 'Eliminar';
        eliminarBtn.onclick = () => {
          eliminarObjetivo(objetivos, i);
          pintarObjetivos();
        };

        fila.appendChild(info);
        fila.appendChild(streak);
        fila.appendChild(btn);
        fila.appendChild(eliminarBtn);
        li.appendChild(fila);

        const calendario = document.createElement('div');
        calendario.hidden = true;
        streak.onclick = () => {
          calendario.hidden = !calendario.hidden;
          if (!calendario.hidden) renderizarCalendario(calendario, obj.historial);
        };
        li.appendChild(calendario);

        lista.appendChild(li);
      });
    }

    function alAgregarObjetivo() {
      const input = document.getElementById('nuevoObjetivo');
      const texto = input.value.trim();
      if (!texto) return;
      agregarObjetivo(texto);
      input.value = '';
      pintarObjetivos();
    }

    document.getElementById('nuevoObjetivo').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') alAgregarObjetivo();
    });

    function revisarObjetivosNoCompletados() {
      const hoy = obtenerHoy();
      const objetivos = cargarObjetivos();
      const algunoNoHecho = objetivos.some(obj => obj.ultimaFechaHecho !== hoy);

      if (algunoNoHecho && Notification.permission === 'granted') {
        new Notification('⚠️ ¡Oye!', {
          body: 'Aún no has marcado todos tus objetivos de hoy.'
        });
      }
    }

    function programarNotificacionDiaria() {
      const ahora = new Date();
      const proxima = new Date();
      proxima.setHours(22, 55, 0, 0);
      if (proxima < ahora) proxima.setDate(proxima.getDate() + 1);

      setTimeout(() => {
        revisarObjetivosNoCompletados();
        programarNotificacionDiaria();
      }, proxima - ahora);
    }

    function actualizarBotonNotificacion() {
      if (!('Notification' in window)) {
        btnNotificar.hidden = true;
        return;
      }
      if (Notification.permission === 'granted') {
        btnNotificar.textContent = 'Recordatorio activado ✅';
        btnNotificar.disabled = true;
      }
    }

    function activarRecordatorio() {
      if (!('Notification' in window)) return;
      Notification.requestPermission().then(() => {
        actualizarBotonNotificacion();
        programarNotificacionDiaria();
      });
    }

    window.addEventListener('load', () => {
      pintarObjetivos();
      actualizarBotonNotificacion();
      if ('Notification' in window && Notification.permission === 'granted') {
        programarNotificacionDiaria();
      }
    });
  </script>
</body>
</html>
